name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # One lockfile for the whole workspace, so a single install covers every
      # package and guarantees they agree on shared dependency versions.
      - run: npm ci
      - name: Run all workspace checks
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Build ${{ matrix.name }} container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: yt-web-client/Dockerfile
            health_path: /
          - name: processor
            dockerfile: video-processing-service/Dockerfile
            health_path: /healthz
    steps:
      - uses: actions/checkout@v5
      # Both images build from the repository root so the workspace and the
      # shared contract package are inside the build context.
      - name: Build container
        run: docker build --file "${{ matrix.dockerfile }}" --tag "redd-${{ matrix.name }}:ci" .
      - name: Smoke-test container
        run: |
          image="redd-${{ matrix.name }}:ci"
          test "$(docker run --rm "$image" id -u)" = 1000
          container_id="$(docker run --rm --detach --publish 127.0.0.1:3000:3000 "$image")"
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:3000${{ matrix.health_path }}" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1
